appId: com.contract-manager.app
productName: Gipfel管理系统
copyright: Copyright © 2026
directories:
  output: dist

asar: false

win:
  artifactName: Gipfel-Setup-${version}.exe
  target:
    - target: nsis
      arch:
        - x64
  certificateFile: certs/gipfel-sign.pfx
  certificatePassword: gipfel-sign-2026
  signAndEditExecutable: true

publish:
  provider: github
  owner: cangshanwen-droid
  repo: contract-manager

nsis:
  artifactName: Gipfel-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 合同管理系统
  uninstallDisplayName: 合同管理系统

icon: assets/icon.ico

files:
  - out/**/*
  - assets/**/*
  - "!src/**/*"
  - "!.git/**/*"

asarUnpack:
  - "node_modules/sql.js/**/*"
