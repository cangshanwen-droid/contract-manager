name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  desktop-tests:
    name: 桌面端 typecheck + vitest + build
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'  # vitest 用 electron mock，无需真二进制
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 类型检查
        run: npm run typecheck
      - name: 单元测试（69 项）
        run: npm test
      - name: 构建
        run: npm run build
